<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hinter</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      font-family: -apple-system, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #overlay {
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      background: rgba(20, 20, 24, 0.88);
      color: #f2f2f2;
      -webkit-app-region: drag; /* lets you drag the whole window by clicking it */
      padding: 14px 16px;
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
    }
    #status {
      font-size: 11px;
      color: #9d9dff;
      -webkit-app-region: no-drag;
    }
    #transcript {
      flex: 1;
      font-size: 13px;
      line-height: 1.5;
      color: #cfcfcf;
      overflow-y: auto;
      -webkit-app-region: no-drag;
    }
    #close-btn {
      -webkit-app-region: no-drag;
      cursor: pointer;
      color: #999;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="header">
      <span>🔎 Hinter</span>
      <span id="status">connecting…</span>
    </div>
    <div id="transcript">
      Live transcript and suggestions will appear here.
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
