<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hinter</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
    }
    #overlay {
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      background: rgba(18, 18, 22, 0.92);
      color: #f2f2f2;
      -webkit-app-region: drag;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    #header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 10px;
    }
    #title {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #status {
      font-size: 11px;
      color: #9d9dff;
      font-weight: 500;
      -webkit-app-region: no-drag;
    }
    #controls {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      -webkit-app-region: no-drag;
    }
    #listen-btn {
      background: #3a3a5c;
      color: #e0e0ff;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    #listen-btn:hover { background: #4a4a72; }
    #listen-btn.listening {
      background: #2d5a3d;
      color: #b8f0c8;
      border-color: rgba(100, 200, 120, 0.3);
    }
    #level-wrap {
      flex: 1;
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      overflow: hidden;
    }
    #level-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5b8def, #7ddea0);
      border-radius: 4px;
      transition: width 0.05s linear;
    }
    #transcript {
      flex: 1;
      font-size: 13px;
      line-height: 1.5;
      color: #c8c8c8;
      overflow-y: auto;
      -webkit-app-region: no-drag;
      margin-bottom: 8px;
    }
    #suggestions {
      font-size: 12px;
      color: #b0b0ff;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
      min-height: 32px;
      -webkit-app-region: no-drag;
    }
    .hint { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="header">
      <div id="title">
        <span>🔎</span>
        <span>Hinter</span>
      </div>
      <span id="status">connecting…</span>
    </div>

    <div id="controls">
      <button id="listen-btn">Start listening</button>
      <div id="level-wrap">
        <div id="level-bar"></div>
      </div>
    </div>

    <div id="transcript">
      <span class="hint">Click “Start listening” to capture mic (and system audio when available).</span>
    </div>

    <div id="suggestions">
      <span class="hint">Suggestions will show here in a later milestone.</span>
    </div>
  </div>

  <script src="./renderer.js"></script>
</body>
</html>
